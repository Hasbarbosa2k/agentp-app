# Configuração do Prometheus para AgentP
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Regras de alerta - ficheiros gerados automaticamente pelo backend
rule_files:
  - "rules/*.yml"

# Alertmanager (opcional)
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter targets - gerenciados dinamicamente
  # O backend vai gerar targets.json com os sistemas registados
  - job_name: 'node_exporter'
    file_sd_configs:
      - files:
          - 'targets.json'
        refresh_interval: 30s

